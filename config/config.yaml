# TrendRadar configuration (config.yaml v2)
app:
  timezone: "Asia/Shanghai"
  show_version_update: false

schedule:
  enabled: true
  preset: "custom"

platforms:
  enabled: true
  sources:
    - { id: "jin10", name: "金十数据" }
    - { id: "fastbull", name: "快讯通" }
    - { id: "cankaoxiaoxi", name: "参考消息" }
    - { id: "sputniknewscn", name: "卫星通讯社" }
    - { id: "zaobao", name: "联合早报" }
    - { id: "toutiao", name: "今日头条" }
    - { id: "wallstreetcn-hot", name: "华尔街见闻" }
    - { id: "thepaper", name: "澎湃新闻" }
    - { id: "bilibili-hot-search", name: "bilibili 热搜" }
    - { id: "cls-hot", name: "财联社热门" }
    - { id: "ifeng", name: "凤凰网" }
    - { id: "weibo", name: "微博" }
    - { id: "ithome", name: "IT之家" }
    - { id: "cls-telegraph", name: "财联社 电报" }
    - { id: "cls-depth", name: "财联社 深度" }

rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 3
  feeds:
    - id: "cn_policy_pbc"
      name: "国内政策｜中国人民银行（官方）"
      url: "http://www.pbc.gov.cn/en/3688110/index.rss"
      enabled: true
      max_age_days: 7
    - id: "intl_us_federal_reserve"
      name: "国际事件｜美国联邦储备委员会（外部环境）"
      url: "https://www.federalreserve.gov/feeds/press_all.xml"
      enabled: true
      max_age_days: 7
    - id: "intl_eu_ecb"
      name: "国际事件｜欧洲中央银行（外部环境）"
      url: "https://www.ecb.europa.eu/rss/press.html"
      enabled: true
      max_age_days: 7
    - id: "intl_uk_boe"
      name: "国际事件｜英格兰银行（外部环境）"
      url: "https://www.bankofengland.co.uk/rss/news"
      enabled: true
      max_age_days: 7
    - id: "intl_jp_boj"
      name: "国际事件｜日本银行（外部环境）"
      url: "https://www.boj.or.jp/en/rss/whatsnew.xml"
      enabled: true
      max_age_days: 7
    - id: "intl_global_bis"
      name: "国际宏观事件｜国际清算银行 BIS"
      url: "https://www.bis.org/rss.xml"
      enabled: true
      max_age_days: 7
    - id: "intl_global_oecd"
      name: "国际宏观事件｜经济合作与发展组织 OECD"
      url: "https://www.oecd.org/rss/generalrss.xml"
      enabled: true
      max_age_days: 7
    - id: "intl_us_sec"
      name: "国际市场事件｜美国证券交易委员会 SEC"
      url: "https://www.sec.gov/news/pressreleases.rss"
      enabled: true
      max_age_days: 7
    - id: "impact_cn_energy_eia"
      name: "国内传导｜美国能源信息署 EIA 能源数据"
      url: "https://www.eia.gov/rss/todayinenergy.xml"
      enabled: true
      max_age_days: 3
    - id: "intl_us_bls"
      name: "国际宏观数据｜美国劳工统计局 BLS"
      url: "https://www.bls.gov/feed/news_release/rss.xml"
      enabled: true
      max_age_days: 7
    - id: "intl_us_bea"
      name: "国际宏观数据｜美国经济分析局 BEA"
      url: "https://www.bea.gov/rss/news_releases.xml"
      enabled: true
      max_age_days: 7

report:
  mode: "current"
  display_mode: "keyword"
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 3

display:
  # Show only the synthesized brief in reports and push messages.
  # Hotlist/RSS/standalone inputs remain available to AI analysis but are not rendered as long detail sections.
  region_order:
    - ai_analysis
  regions:
    hotlist: true
    new_items: false
    rss: true
    standalone: false
    ai_analysis: true
  standalone:
    platforms: ["zhihu", "wallstreetcn-hot"]
    rss_feeds:
      - "cn_policy_pbc"
      - "intl_us_federal_reserve"
      - "intl_eu_ecb"
      - "intl_jp_boj"
      - "intl_global_bis"
      - "impact_cn_energy_eia"
    max_items: 3

notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""

storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 7

ai:
  model: "deepseek/openrouter/free"
  api_key: ""
  api_base: "https://openrouter.ai/api/v1/chat/completions"
  timeout: 120
  temperature: 1.0
  max_tokens: 7000
  num_retries: 1
  fallback_models: []

ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_policy_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 80
  include_rss: true
  include_standalone: true
  include_rank_timeline: true

ai_translation:
  enabled: false
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"

advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
